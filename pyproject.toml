[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitshelf"
version = "0.1.0"
description = "CLI tool for managing local git repositories like a bookshelf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Jonathan Laporte"}]
keywords = ["git", "cli", "repository", "management", "organization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.scripts]
gitshelf = "gitshelf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
