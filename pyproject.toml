[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitshelf"
version = "0.3.0"
description = "CLI tool for managing local git repositories like a bookshelf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Jonathan Laporte"}]
keywords = ["git", "cli", "repository", "management", "organization", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.scripts]
gitshelf = "gitshelf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.1"]

[project.urls]
Repository = "https://github.com/jlaportebot/gitshelf"
Issues = "https://github.com/jlaportebot/gitshelf/issues"
